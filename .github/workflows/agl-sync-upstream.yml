name: agl sync upstream

# Keeps this fork in step with trycua/cua. `main` is a pure mirror of upstream
# (fast-forward only); `agl` carries our patches and has upstream merged in.
# A conflict opens or updates one issue instead of leaving `agl` behind quietly.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: agl-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main --jq '.message'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agl
          fetch-depth: 0

      - name: Merge main into agl
        id: merge
        run: |
          git config user.name "agl-sync"
          git config user.email "agl-sync@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "agl already contains main"
            exit 0
          fi
          if git merge --no-edit origin/main; then
            git push origin agl
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="agl cannot merge upstream main"
          body="Merging upstream main into agl conflicts. Merge origin/main into agl by hand, resolve it, and push. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
